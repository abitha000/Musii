name: Validate Tommy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q VenomX config strings

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg aria2 chromium
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify media tools
        run: |
          ffmpeg -version
          aria2c --version
          chromium --version
          python -m yt_dlp --version
      - name: Compile after dependency install
        run: python -m compileall -q VenomX config strings
